[package]
name = "esp32c6-n16-app"
description = "Main ESP32-C6-N16 application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "esp32c6-n16-app"
path = "src/main.rs"
test = false
bench = false
harness = false

[dependencies]
esp32c6-n16-runtime.workspace = true
esp32c6-n16-bsp.workspace = true
esp32c6-n16-wifi = { workspace = true, features = ["net", "coex"] }
esp32c6-n16-ble.workspace = true
esp-hal.workspace = true
embassy-net.workspace = true
esp-alloc.workspace = true
esp-rtos.workspace = true
esp-backtrace.workspace = true
esp-bootloader-esp-idf.workspace = true
embassy-executor.workspace = true
embassy-futures.workspace = true
embassy-time.workspace = true
defmt.workspace = true
defmt-rtt.workspace = true

[dev-dependencies]
embedded-test = { version = "=0.7.3", features = ["defmt"] }

# On-target tests. Kept deliberately separate from the firmware binary, which
# has test/bench/harness disabled.
[[test]]
name = "hardware"
path = "tests/hardware.rs"
harness = false

[lints]
workspace = true
