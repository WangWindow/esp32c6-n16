[package]
name = "esp32c6-n16-wifi"
description = "Wi-Fi station, scanning and DHCP helpers for the ESP32-C6-N16 board"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
test = false
bench = false
harness = false

[dependencies]
esp-hal.workspace = true
esp-radio = { workspace = true, features = ["wifi"] }
embassy-net = { workspace = true, optional = true }
embedded-io-async.workspace = true
heapless.workspace = true
embassy-time.workspace = true
static_cell = { workspace = true, optional = true }
defmt.workspace = true

[features]
default = []
# DHCP / embassy-net stack, only needed by station-style apps.
net = ["dep:embassy-net", "dep:static_cell"]
# Enable Wi-Fi + BLE radio coexistence. Requires the BLE crate/feature as well.
coex = ["esp-radio/coex"]

[lints]
workspace = true
