[workspace]
resolver = "3"
default-members = ["app"]
members = [
    "app",
    "examples/selftest",
    "examples/wifi",
    "examples/ble",
    "crates/runtime",
    "crates/bsp",
    "crates/wifi",
    "crates/ble",
    "crates/log",
    "crates/testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# --- Espressif HAL / radio -------------------------------------------------
# esp-radio 1.0.0-beta.1 is the published line that targets esp-hal 1.2.x.
# Keep these pinned with `=` and commit Cargo.lock for reproducible firmware.
esp-hal = { version = "=1.2.2", features = ["esp32c6", "unstable", "defmt"] }
esp-radio = { version = "=1.0.0-beta.1", features = [
    "esp32c6",
    "unstable",
    "defmt",
    "esp-alloc",
] }
esp-rtos = { version = "=0.4.0", features = [
    "esp32c6",
    "esp-radio",
    "embassy",
    "defmt",
    "esp-alloc",
] }
esp-alloc = { version = "=0.11.0", features = ["esp32c6", "defmt"] }
esp-backtrace = { version = "=0.20.0", features = ["esp32c6", "panic-handler", "defmt"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32c6"] }
esp-hal-smartled = { version = "=0.18.0", default-features = false }
esp-metadata-generated = { version = "=0.5.3", features = ["esp32c6"] }

# --- Embassy ---------------------------------------------------------------
embassy-executor = "=0.10.0"
embassy-futures = "=0.1.2"
embassy-net = { version = "=0.9.1", features = [
    "defmt",
    "dhcpv4",
    "medium-ethernet",
    "proto-ipv4",
    "tcp",
    "udp",
    "dns",
] }
embassy-sync = "=0.8.0"
embassy-time = "=0.5.1"

# --- BLE host --------------------------------------------------------------
trouble-host = { version = "=0.7.0", default-features = false, features = [
    "peripheral",
    "gatt",
    "derive",
    "defmt",
    "default-packet-pool-mtu-255",
] }

# --- Logging / utilities ---------------------------------------------------
defmt = "=1.2.0"
defmt-rtt = "=1.3.1"
static_cell = "=2.1.1"
smart-leds = "=0.4.0"
heapless = "=0.9.4"
embedded-io-async = "=0.7.0"

# --- Internal crates -------------------------------------------------------
esp32c6-n16-runtime = { path = "crates/runtime" }
esp32c6-n16-bsp = { path = "crates/bsp" }
esp32c6-n16-wifi = { path = "crates/wifi" }
esp32c6-n16-ble = { path = "crates/ble" }
esp32c6-n16-log = { path = "crates/log" }
esp32c6-n16-testkit = { path = "crates/testkit" }

# --- Release-only profile policy ------------------------------------------
# Cargo always provides a `dev` profile, but it must not produce large, slow,
# unoptimized artifacts. `dev` therefore repeats the release settings (Cargo
# does not allow `inherits` in a root profile). Every documented workflow uses
# `--release`; accidental `cargo build` is still optimized and carries no DWARF.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"

[profile.dev]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 0
panic = "abort"
overflow-checks = false
incremental = false

[profile.test]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 0
overflow-checks = false
incremental = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
