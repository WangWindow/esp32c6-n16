[package]
name = "esp32c6-n16"
version = "0.1.0"
edition = "2024"

# Bare-metal targets don't ship libtest. Disable the test harness so
# `cargo check --all-targets` (used by rust-analyzer) doesn't look for `test`.
[[bin]]
name = "esp32c6-n16"
path = "src/main.rs"
test = false
bench = false
harness = false

[dependencies]
esp-backtrace = { version = "0.20.0", features = ["esp32c6", "panic-handler", "defmt"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6"] }
esp-hal = { version = "1.2.2", features = ["esp32c6", "unstable"] }
esp-hal-smartled = { version = "0.18.0", default-features = false }
defmt = "1.2"
defmt-rtt = "1.3"
smart-leds = "0.4"

[profile.release]
opt-level = "s"
debug = 2
